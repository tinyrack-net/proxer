name: proxer
description: Self-hosted reverse-tunnel CLI for HTTP, SSE, and WebSocket services.
version: 0.14.2
publish_to: none
environment:
  sdk: ^3.12.0

executables:
  proxer: proxer

dependencies:
  cliweave:
    git:
      url: https://github.com/tinyrack-net/dart-packages
      ref: 5da5311a53bc2cf401f4bc8efb97518adeeced32
      path: packages/cliweave
  dartastic_opentelemetry: ^0.11.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  shipworld:
    git:
      url: https://github.com/tinyrack-net/dart-packages
      ref: 5da5311a53bc2cf401f4bc8efb97518adeeced32
      path: packages/shipworld
  test: ^1.32.0

# shipworld declares cliweave as a hosted dependency, which conflicts with the
# git source above; the override pins both to the same commit.
dependency_overrides:
  cliweave:
    git:
      url: https://github.com/tinyrack-net/dart-packages
      ref: 5da5311a53bc2cf401f4bc8efb97518adeeced32
      path: packages/cliweave
