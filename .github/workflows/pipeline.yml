name: CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run typecheck
        run: pnpm run typecheck

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm run build
      - name: Run tests
        run: pnpm run test

  build-pkg:
    name: Build Pkg
    needs:
      - lint
      - typecheck
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build pkg
        run: pnpm --filter @tinyrack/proxer run pkg:build -- --target node24-linux-x64,node24-linux-arm64,node24-macos-x64,node24-macos-arm64,node24-win-x64,node24-win-arm64

      - name: Upload Linux x64
        uses: actions/upload-artifact@v4
        with:
          name: proxer-linux-x64
          path: packages/cli/dist/pkg/proxer-linux-x64
          if-no-files-found: error

      - name: Upload Linux arm64
        uses: actions/upload-artifact@v4
        with:
          name: proxer-linux-arm64
          path: packages/cli/dist/pkg/proxer-linux-arm64
          if-no-files-found: error

      - name: Upload macOS x64
        uses: actions/upload-artifact@v4
        with:
          name: proxer-darwin-x64
          path: packages/cli/dist/pkg/proxer-macos-x64
          if-no-files-found: error

      - name: Upload macOS arm64
        uses: actions/upload-artifact@v4
        with:
          name: proxer-darwin-arm64
          path: packages/cli/dist/pkg/proxer-macos-arm64
          if-no-files-found: error

      - name: Upload Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: proxer-win32-x64.exe
          path: packages/cli/dist/pkg/proxer-win-x64.exe
          if-no-files-found: error

      - name: Upload Windows arm64
        uses: actions/upload-artifact@v4
        with:
          name: proxer-win32-arm64.exe
          path: packages/cli/dist/pkg/proxer-win-arm64.exe
          if-no-files-found: error

  smoke-test:
    name: Smoke Test (${{ matrix.platform }}-${{ matrix.arch }})
    needs: build-pkg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: proxer-linux-x64
            executable: proxer-linux-x64
            arch: x64
          - os: macos-26
            platform: darwin
            artifact: proxer-darwin-x64
            executable: proxer-macos-x64
            arch: x64
          - os: macos-26
            platform: darwin
            artifact: proxer-darwin-arm64
            executable: proxer-macos-arm64
            arch: arm64
          - os: windows-latest
            platform: win32
            artifact: proxer-win32-x64.exe
            executable: proxer-win-x64.exe
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/dist/pkg

      - name: Restore executable permissions
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x packages/cli/dist/pkg/proxer-*

      - name: Smoke test binary (Non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: pnpm --filter @tinyrack/proxer run pkg:smoke -- --skip-build --executable-path "packages/cli/dist/pkg/${{ matrix.executable }}"

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: pnpm --filter @tinyrack/proxer run pkg:smoke -- --skip-build --executable-path "packages/cli/dist/pkg/${{ matrix.executable }}"
