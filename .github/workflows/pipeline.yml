name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: tinyrack-net/proxer
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_USERNAME: tinyrack
  DOCKERHUB_IMAGE_NAME: tinyrack/proxer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled merge-queue check reads as a failure and ejects the pull
  # request from the queue, so those runs always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' &&
    !startsWith(github.ref, 'refs/tags/v') &&
    github.event_name != 'merge_group' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm run format:check
        working-directory: homepage

  dart-analyze:
    name: Dart Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Validate Dart static checks
        run: dart run tool/validate.dart dart-static

  dart-test:
    name: Dart Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Validate Dart tests
        run: dart run tool/validate.dart dart-tests

  homepage:
    name: Homepage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Validate homepage
        run: pnpm run validate
        working-directory: homepage
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: homepage
      - name: Audit homepage in Chromium
        run: pnpm run test:audit
        working-directory: homepage
      - name: Verify Cloudflare deployment bundle
        run: pnpm run deploy:dry-run
        working-directory: homepage

  build-and-package:
    name: Build & Package (${{ matrix.target }})
    needs:
      - dart-analyze
      - dart-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            asset: proxer-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            asset: proxer-linux-arm64
          # macos-13 (the previous Intel label) was retired by GitHub;
          # macos-15-intel is the supported Intel macOS runner.
          - os: macos-15-intel
            target: macos-x64
            asset: proxer-macos-x64
          - os: macos-26
            target: macos-arm64
            asset: proxer-macos-arm64
          - os: windows-2025
            target: win-x64
            asset: proxer-win-x64.exe
            msixarch: x64
          - os: windows-11-arm
            target: win-arm64
            asset: proxer-win-arm64.exe
            msixarch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Install dependencies
        run: dart pub get

      - name: Compile executable
        run: dart compile exe bin/proxer.dart -o ${{ matrix.asset }}

      - name: Sign binary (macOS)
        if: startsWith(matrix.target, 'macos') && (github.ref ==
          'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          dart run shipworld:shipworld package macos sign proxer \
            --config shipworld.yaml \
            --input ${{ matrix.asset }} \
            ${{ !startsWith(github.ref, 'refs/tags/v') && '--skip-notarize' || '' }}

      - name: Smoke test binary
        run: dart run tool/smoke.dart --executable-path
          ${{ matrix.asset }}

      - name: Build MSIX package (Windows)
        if: matrix.msixarch && startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME ||
            'tinyrack.proxer' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=tinyrack' }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME ||
            'tinyrack' }}
        run: dart run shipworld:shipworld package windows msix
          proxer --config shipworld.yaml --arch ${{ matrix.msixarch }}
          --input ${{ matrix.asset }}
          --output dist/pkg/proxer-win-${{ matrix.msixarch }}.msix
          --package-root dist/msix/${{ matrix.msixarch }}

      - name: Smoke test MSIX alias (Windows x64)
        if: matrix.msixarch == 'x64' && startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME ||
            'tinyrack.proxer' }}
        run: |
          $existing = Get-AppxPackage -Name "$env:MSIX_IDENTITY_NAME" -ErrorAction SilentlyContinue
          if ($existing) {
            Remove-AppxPackage -Package $existing.PackageFullName
          }
          Add-AppxPackage -Register (Resolve-Path "dist/msix/x64/AppxManifest.xml")
          try {
            proxer.exe --version
          } finally {
            $package = Get-AppxPackage -Name "$env:MSIX_IDENTITY_NAME" -ErrorAction SilentlyContinue
            if ($package) {
              Remove-AppxPackage -Package $package.PackageFullName
            }
          }

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload MSIX (Windows)
        if: matrix.msixarch && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: proxer-win32-${{ matrix.msixarch }}-msix
          path: dist/pkg/proxer-win-${{ matrix.msixarch }}.msix
          if-no-files-found: error

  bundle-msix:
    name: Bundle MSIX
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Install dependencies
        run: dart pub get
      - name: Download Windows x64 MSIX
        uses: actions/download-artifact@v8
        with:
          name: proxer-win32-x64-msix
          path: dist/pkg
      - name: Download Windows arm64 MSIX
        uses: actions/download-artifact@v8
        with:
          name: proxer-win32-arm64-msix
          path: dist/pkg
      - name: Bundle Windows MSIX packages
        shell: powershell
        run: dart run shipworld:shipworld package windows
          bundle proxer --config shipworld.yaml
          --package-dir dist/pkg
          --output dist/pkg/proxer-windows.msixbundle
          --working-directory dist/msix/bundle
      - name: Upload Windows MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: proxer-windows-msixbundle
          path: dist/pkg/proxer-windows.msixbundle
          if-no-files-found: error

  build-appimage:
    name: Build AppImage (${{ matrix.arch }})
    needs:
      - lint
      - dart-analyze
      - dart-test
      - build-and-package
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: proxer-linux-x64
            arch: x86_64
            appimagetool_sha256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
          - os: ubuntu-24.04-arm
            artifact: proxer-linux-arm64
            arch: aarch64
            appimagetool_sha256: 1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Install dependencies
        run: dart pub get
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: release-bin
      - name: Restore executable permissions
        shell: bash
        run: chmod +x release-bin/proxer-*
      - name: Install verified appimagetool
        shell: bash
        run: |
          curl --fail --location --output appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          echo "${{ matrix.appimagetool_sha256 }}  appimagetool" | sha256sum --check -
          chmod +x appimagetool
      - name: Build AppImage
        env:
          APPIMAGETOOL_PATH: ${{ github.workspace }}/appimagetool
        run: dart run shipworld:shipworld package linux
          appimage proxer --config shipworld.yaml
          --input release-bin/${{ matrix.artifact }}
          --output ${{ matrix.artifact }}.AppImage
          --arch ${{ matrix.arch }}
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-appimage
          path: ${{ matrix.artifact }}.AppImage

  publish-release:
    name: Publish Release
    needs:
      - lint
      - dart-analyze
      - dart-test
      - homepage
      - build-and-package
      - bundle-msix
      - build-appimage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Install dependencies
        run: dart pub get

      - name: Verify tag matches package version
        run: dart run shipworld:shipworld release verify
          proxer --config shipworld.yaml

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: proxer-*
          path: release-assets
          merge-multiple: true

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r artifact_path; do
            gh release upload "${GITHUB_REF_NAME}" "${artifact_path}" --clobber
          done < <(find release-assets -type f | sort)

      - name: Generate Homebrew Formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          dart run shipworld:shipworld package homebrew formula \
            proxer --config shipworld.yaml \
            --artifacts-dir "${{ github.workspace }}/release-assets" \
            --output "release-assets/proxer.rb" \
            --versioned-output "release-assets/proxer@${version}.rb"

      - name: Checkout Homebrew Tap
        uses: actions/checkout@v7
        with:
          repository: tinyrack-net/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew Tap
        run: |
          mkdir -p homebrew-tap/Formula
          cp release-assets/proxer*.rb homebrew-tap/Formula/
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/proxer*.rb
          git commit -m "Update proxer to ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push

  publish-winget:
    name: Publish WinGet
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Submit WinGet manifest update
        shell: powershell
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "WINGET_TOKEN repository secret is required for WinGet publishing."
          }

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME"
          $releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/$env:GITHUB_REF_NAME"

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update tinyrack.proxer `
            --version $version `
            --urls "$downloadUrl/proxer-win-x64.exe|x64" "$downloadUrl/proxer-win-arm64.exe|arm64" `
            --release-notes-url "$releaseNotesUrl" `
            --submit `
            --no-open

  publish-store:
    name: Publish to Microsoft Store
    needs: publish-release
    if: false # Temporarily disabled
    # if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download MSIX bundle
        uses: actions/download-artifact@v8
        with:
          name: proxer-windows-msixbundle
          path: store-assets

      - name: Set up Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Microsoft Store CLI
        shell: powershell
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId "$env:PARTNER_CENTER_TENANT_ID" `
            --sellerId "$env:PARTNER_CENTER_SELLER_ID" `
            --clientId "$env:PARTNER_CENTER_CLIENT_ID" `
            --clientSecret "$env:PARTNER_CENTER_CLIENT_SECRET"

      - name: Publish MSIX bundle to Store
        shell: powershell
        env:
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: |
          $bundle = Resolve-Path "store-assets/proxer-windows.msixbundle"
          msstore publish "$bundle" -id "$env:MSSTORE_PRODUCT_ID"
          msstore submission poll "$env:MSSTORE_PRODUCT_ID"

  publish-snap:
    name: Publish Snap (${{ matrix.artifact }})
    needs:
      - lint
      - dart-analyze
      - dart-test
      - build-and-package
    if: false # Temporarily disabled
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: proxer-linux-x64
          - os: ubuntu-24.04-arm
            artifact: proxer-linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: bin-temp

      - name: Prepare binary
        run: |
          mv bin-temp/${{ matrix.artifact }} ./proxer
          chmod +x ./proxer

      - name: Build Snap
        id: build
        uses: snapcore/action-build@v1

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-snap
          path: ${{ steps.build.outputs.snap }}

      - name: Publish Snap
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  docker-smoke:
    name: Docker Smoke
    needs:
      - dart-analyze
      - dart-test
    if: github.event_name == 'pull_request' ||
      github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: proxer:ci
      - name: Smoke test Docker image
        run: docker run --rm proxer:ci --version

  quality-gate:
    name: Quality Gate
    # The single required check for `main`. Branch protection and the merge
    # queue both gate on this job, so it has to report on every pull request
    # and every merge-queue run, including when a job it needs fails.
    if: always() && (github.event_name == 'pull_request' ||
      github.event_name == 'merge_group')
    needs:
      - lint
      - dart-analyze
      - dart-test
      - homepage
      - build-and-package
      - docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$QUALITY_RESULTS"

  publish-docker:
    name: Publish Docker Image
    needs:
      - dart-analyze
      - dart-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
