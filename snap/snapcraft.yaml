name: proxer
base: core24
version: git
summary: Self-hosted reverse tunnel for HTTP, SSE, and WebSocket services.
description: |
  Proxer exposes private HTTP services through a public server while preserving
  streaming, Server-Sent Events, and WebSocket traffic.
confinement: classic
grade: stable

parts:
  proxer:
    plugin: dump
    source: .
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp proxer $CRAFT_PART_INSTALL/bin/
      chmod +x $CRAFT_PART_INSTALL/bin/proxer

apps:
  proxer:
    command: bin/proxer
